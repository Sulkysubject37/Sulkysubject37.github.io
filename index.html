<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD. Arshad (SulkySubject37) // Portfolio</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Instrument+Sans:wght@300;400;500&family=JetBrains+Mono:wght@100;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Randomizer Logic for Theme and Layout -->
    <script>
        const themes = ['oat', 'matcha', 'rose', 'slate', 'sand', 'midnight', 'plum', 'sage', 'sepia', 'abyss'];
        const layouts = ['layout-a', 'layout-b', 'layout-c'];
        
        const lastTheme = localStorage.getItem('last_portfolio_theme');
        const lastLayout = localStorage.getItem('last_portfolio_layout');
        
        let availThemes = themes.filter(t => t !== lastTheme);
        if(availThemes.length === 0) availThemes = themes;
        
        let availLayouts = layouts.filter(l => l !== lastLayout);
        if(availLayouts.length === 0) availLayouts = layouts;
        
        const newTheme = availThemes[Math.floor(Math.random() * availThemes.length)];
        const newLayout = availLayouts[Math.floor(Math.random() * availLayouts.length)];
        
        localStorage.setItem('last_portfolio_theme', newTheme);
        localStorage.setItem('last_portfolio_layout', newLayout);
        
        document.documentElement.setAttribute('data-theme', newTheme);
        document.documentElement.setAttribute('data-layout', newLayout);
    </script>
</head>
<body>

    <!-- Reimagined Elegant Boot Sequence -->
    <div id="boot-overlay">
        <div class="boot-content">
            <div class="boot-text" id="boot-text">The Cruel Standard.</div>
            <div class="boot-subtext" id="boot-subtext">Compiling context...</div>
        </div>
    </div>

    <!-- Fluid Background (shared across layouts) -->
    <div id="fluid-bg"></div>

    <!-- Main App Container -->
    <div id="app">
        <!-- Content will be injected here by script.js -->
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
